name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install skills CLI (optional, for local validation)
        run: npm i -g @anthropic-ai/agent-skills || true

      - name: Validate repo structure
        run: bash scripts/validate-repo.sh
